spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/member-db-test
    driverClassName: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple # disable Redis for tests

logging:
  level:
    root: WARN
    org.springframework.security: DEBUG
